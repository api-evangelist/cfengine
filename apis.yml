aid: cfengine

name: Cfengine

image: https://cfengine.com/images/previews/logo_wide_opengraph.png

description: Cfengine provides infrastructure automation, security, and compliance solutions for large-scale environments. Offering both open
  source and commercial editions, it enables configuration management, CI/CD integration, and policy compliance across Linux and Windows systems.
  The platform includes AI‑assisted insights, extensive policy libraries, and a web UI for monitoring and reporting, serving enterprises worldwide.

